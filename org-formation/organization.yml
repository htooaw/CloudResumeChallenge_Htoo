AWSTemplateFormatVersion: '2010-09-09-OC'
Description: AWS Organization for Terraform learning

Organization:
  MasterAccount:
    Type: OC::ORG::MasterAccount
    Properties:
      Alias: org-formation-master
      RootEmail: <org-root-email>
      AccountName: Htoo Aung Win General
      AccountId: '<management-account-id>'

  OrganizationRoot:
    Type: OC::ORG::OrganizationRoot

  # Logical IDs keep the old "Sandbox" name on purpose: org-formation tracks
  # resources by logical ID, so renaming them could look like remove + add.
  SandboxOU:
    Type: OC::ORG::OrganizationalUnit
    Properties:
      OrganizationalUnitName: Prod
      Accounts:
        - Ref: SandboxAccount

  SandboxAccount:
    Type: OC::ORG::Account
    Properties:
      AccountName: prod-account   # renamed in the console; org-formation can't rename accounts
      RootEmail: <prod-root-email>
      Alias: sandbox-account


  TestOU:
    Type: OC::ORG::OrganizationalUnit
    Properties:
      OrganizationalUnitName: Test
      Accounts:
        - Ref: TestAccount
  
  TestAccount:
    Type: OC::ORG::Account
    Properties:
      AccountName: test-account
      RootEmail: <test-root-email>
      Alias: test-account