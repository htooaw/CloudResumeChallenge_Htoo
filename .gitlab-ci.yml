stages:
  - unittest
  - terraformplan
  - terraformapply
  - build
  - deploy
  - smoketest

variables:
  AWS_DEFAULT_REGION: ap-southeast-1
  S3_BUCKET: h4wops.com
  ROLE_ARN: arn:aws:iam::111111111111:role/gitlab_ci_deploy
  AUD: https://gitlab.com
  BUILD_OUTPUT: portfolio/out
  TEST_ROLE_ARN: arn:aws:iam::222222222222:role/gitlab_ci_deploy

unit_test:
  stage: unittest
  image: python:3.12-slim
  script:
    - pip install -r lambda/visitor_count/requirements-dev.txt
    - cd lambda/visitor_count
    - python -m pytest tests/ -v

terraform_plan_test:
  stage: terraformplan
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  id_tokens:
    AWS_TOKEN:
      aud: $AUD
  variables:
    TF_WORKSPACE: cloudresumechallenge-haw-test
  script:
    - echo "$AWS_TOKEN" > /tmp/oidc_token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc_token
    - export AWS_ROLE_ARN="$TEST_ROLE_ARN"
    - cd infra/
    - terraform init
    - terraform plan
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

terraform_apply_test:
  stage: terraformapply
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  id_tokens:
    AWS_TOKEN:
      aud: $AUD
  variables:
    TF_WORKSPACE: cloudresumechallenge-haw-test
  script:
    - echo "$AWS_TOKEN" > /tmp/oidc_token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc_token
    - export AWS_ROLE_ARN="$TEST_ROLE_ARN"
    - cd infra/
    - terraform init
    - terraform apply -auto-approve
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false

  
build_site:
  stage: build
  image: node:lts-alpine
  script:
    - cd portfolio
    - npm install
    - npm run build
  artifacts:
    paths:
      - portfolio/out

deploy_site:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  id_tokens:
    AWS_TOKEN:
      aud: $AUD
  script:
    - echo "$AWS_TOKEN" > /tmp/oidc_token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc_token
    - export AWS_ROLE_ARN="$ROLE_ARN"
    - aws sts get-caller-identity # sanity check: prints the assumed role
    - aws s3 sync ./portfolio/out s3://$S3_BUCKET/ --delete
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

smoke_test:
  stage: smoketest
  image: mcr.microsoft.com/playwright:v1.60.0-jammy
  script:
    - cd tests/browser
    - npm install
    - npx playwright test
  artifacts:
   when: on_failure
   paths:
      - tests/browser/playwright-report/
      - tests/browser/test-results/
   expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
